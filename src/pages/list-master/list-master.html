<ion-header>

  <ion-navbar>
    <ion-title>{{ 'LIST_MASTER_TITLE' | translate }}</ion-title>

    <ion-buttons end>
      <button ion-button icon-only (click)="addItem()">
        <ion-icon name="add"></ion-icon>
      </button>
    </ion-buttons>
  </ion-navbar>

</ion-header>

<ion-content class="card-background-page">
    <ion-refresher class="align" pullMin="100" (ionRefresh)="doRefresh($event)">
      <ion-refresher-content class="refresh"
        pullingText="<br>Release to refresh!"
        refreshingSpinner="crescent"
        refreshingText="<br>Getting the new workouts... 💪">
      </ion-refresher-content>
      </ion-refresher>
    
    <ion-card (click)="openWarmup()">
      <img src="/assets/img/stretch.jpg"/>
      <div class="card-title">Warmups</div>
      <div class="card-subtitle"><br>4 Exercises</div>
    </ion-card>
  
    <ion-card (click)="openActive()">
      <img src="/assets/img/straight.jpg"/>
      <div class="card-title">Active</div>
      <div class="card-subtitle"><br>4 Exercises</div>
    </ion-card>
  
    <ion-card (click)="openWeights()">
      <img src="/assets/img/weights.jpg"/>
      <div class="card-title">With Weights</div>
      <div class="card-subtitle"><br>2 Exercises</div>
    </ion-card>
  
    <ion-card (click)="openCooldown()">
      <img src="/assets/img/cooldown.jpg"/>
      <div class="card-title">Cooldown</div>
      <div class="card-subtitle"><br>8 Exercises</div>
    </ion-card>
  
  </ion-content>
