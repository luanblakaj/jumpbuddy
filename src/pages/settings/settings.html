<ion-header>

  <ion-navbar>
    <ion-title>My Profile</ion-title>
  </ion-navbar>

</ion-header>

<ion-content>
    <img class="avatar" src="assets/imgs/bg.jpeg">
  <form [formGroup]="form" *ngIf="settingsReady">
    <ion-list *ngIf="page == 'main'">
      <ion-item>
        <ion-input formControlName="option2"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label>Where do you Live?</ion-label>
        <ion-select formControlName="option3">
          <ion-option value="1" checked="true">Basel</ion-option>
          <!--<ion-option value="2"></ion-option>
          <ion-option value="3">3</ion-option>-->
        </ion-select>
      </ion-item>
      <button ion-item [navPush]="subSettings" [navParams]="profileSettings">
        {{ 'SETTINGS_PROFILE_BUTTON' | translate }}
      </button>
    </ion-list>

    <ion-list *ngIf="page == 'profile'">
      <ion-item>
        <ion-label floating>My Accomplishements</ion-label>
        <ion-textarea formControlName="option4"></ion-textarea>
      </ion-item>
    </ion-list>
  </form>

</ion-content>
