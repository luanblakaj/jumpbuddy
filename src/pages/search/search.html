<ion-header>

  <ion-navbar>
    <ion-title>{{ 'SEARCH_TITLE' | translate }}</ion-title>
  </ion-navbar>

</ion-header>


<ion-content class="cards-bg">
  <ion-list no-lines>
    <ion-card class="adv-map" *ngFor="let thing of cardz; let i = index;">
      <div style="position: relative">
        <img src="{{thing.map}}">
        <ion-fab right top >
          <button ion-fab class="fab-map" onclick="{{thing.link}}">
            <ion-icon name='pin'></ion-icon>
          </button>
        </ion-fab>
      </div>
      <ion-item>
        <ion-icon color="subtle" large item-start name='walk'></ion-icon>
        <h2>{{thing.title}}</h2>
        <p>{{thing.address}}</p>
      </ion-item>
      <ion-item actions>
        <span ion-text item-start color="secondary" class="item-bold">in Basel</span>
      </ion-item>
      <ion-item actions>
        <span ion-text item-start class="item-bold red">{{thing.warning}}</span>
      </ion-item>
    </ion-card>
  </ion-list>
</ion-content>
